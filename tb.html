<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TaskFlow</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f13;
    --surface: #18181f;
    --surface2: #22222d;
    --border: #2e2e3a;
    --accent: #7c6dfa;
    --accent2: #fa6d9a;
    --text: #f0f0f5;
    --muted: #8888a0;
    --green: #4fd4a0;
    --yellow: #f5c842;
    --red: #fa6d6d;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* TITLE BAR */
  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: 44px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;
    flex-shrink: 0;
  }
  .titlebar-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .app-icon {
    width: 22px; height: 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .app-name {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text);
  }
  .titlebar-controls {
    display: flex;
    gap: 8px;
    -webkit-app-region: no-drag;
  }
  .ctrl-btn {
    width: 13px; height: 13px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .ctrl-btn:hover { opacity: 0.8; }
  .ctrl-close { background: #ff5f57; }
  .ctrl-min { background: #febc2e; }
  .ctrl-max { background: #28c840; }

  /* LAYOUT */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 0;
    flex-shrink: 0;
  }
  .sidebar-section {
    padding: 0 16px;
    margin-bottom: 24px;
  }
  .sidebar-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
    padding: 0 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--muted);
    transition: all 0.15s;
    margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: rgba(124,109,250,0.15); color: var(--accent); }
  .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
  .nav-badge {
    margin-left: auto;
    background: var(--accent);
    color: white;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
  }
  .sidebar-avatar {
    margin-top: auto;
    padding: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    flex-shrink: 0;
  }
  .avatar-info { flex: 1; min-width: 0; }
  .avatar-name { font-size: 13px; font-weight: 600; }
  .avatar-role { font-size: 11px; color: var(--muted); }

  /* MAIN */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* TOOLBAR */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .toolbar-title {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 800;
    flex: 1;
  }
  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    width: 220px;
  }
  .search-box input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    width: 100%;
  }
  .search-box input::placeholder { color: var(--muted); }
  .search-icon { color: var(--muted); font-size: 14px; }

  .btn-primary {
    display: flex; align-items: center; gap: 7px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-primary:hover { background: #9080ff; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(124,109,250,0.35); }

  /* CONTENT */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }
  .content::-webkit-scrollbar { width: 4px; }
  .content::-webkit-scrollbar-track { background: transparent; }
  .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* STATS */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    transition: all 0.2s;
    cursor: default;
  }
  .stat-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .stat-label { font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: 0.04em; margin-bottom: 6px; }
  .stat-value { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .stat-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }

  /* TASKS */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .filter-tabs {
    display: flex;
    gap: 4px;
  }
  .filter-tab {
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
    transition: all 0.15s;
  }
  .filter-tab:hover { color: var(--text); background: var(--surface2); }
  .filter-tab.active { background: var(--surface2); color: var(--text); }

  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .task-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: all 0.15s;
    animation: slideIn 0.25s ease both;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .task-item:hover { border-color: var(--accent); background: var(--surface2); }
  .task-item.done { opacity: 0.5; }
  .task-item.done .task-title { text-decoration: line-through; color: var(--muted); }

  .checkbox {
    width: 20px; height: 20px;
    border-radius: 6px;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    transition: all 0.15s;
    cursor: pointer;
  }
  .task-item.done .checkbox { background: var(--green); border-color: var(--green); color: #0f0f13; font-weight: 700; }

  .task-info { flex: 1; min-width: 0; }
  .task-title { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
  .task-meta { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--muted); }
  .task-tag {
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
  }
  .tag-work { background: rgba(124,109,250,0.18); color: var(--accent); }
  .tag-personal { background: rgba(250,109,154,0.15); color: var(--accent2); }
  .tag-urgent { background: rgba(250,109,109,0.15); color: var(--red); }
  .tag-health { background: rgba(79,212,160,0.15); color: var(--green); }

  .priority-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .p-high { background: var(--red); box-shadow: 0 0 6px rgba(250,109,109,0.5); }
  .p-mid { background: var(--yellow); }
  .p-low { background: var(--green); }

  .task-actions {
    display: flex; gap: 6px; opacity: 0; transition: opacity 0.15s;
  }
  .task-item:hover .task-actions { opacity: 1; }
  .task-action-btn {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .task-action-btn:hover { color: var(--red); border-color: var(--red); background: rgba(250,109,109,0.1); }

  /* ADD TASK MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 420px;
    padding: 28px;
    transform: translateY(16px) scale(0.97);
    transition: all 0.2s;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .modal-overlay.open .modal { transform: translateY(0) scale(1); }
  .modal-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px; font-weight: 800; margin-bottom: 20px;
  }
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 7px; display: block; }
  .form-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-input:focus { border-color: var(--accent); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    appearance: none;
    cursor: pointer;
  }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
  .btn-ghost {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 10px; padding: 9px 16px; font-size: 13px; font-weight: 600;
    font-family: inherit; cursor: pointer; transition: all 0.15s;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--text); }

  /* EMPTY STATE */
  .empty {
    text-align: center; padding: 50px 20px; color: var(--muted);
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-text { font-size: 14px; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 18px;
    font-size: 13px; font-weight: 500;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    transform: translateY(80px); opacity: 0;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 200;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast-icon { font-size: 16px; }
</style>
</head>
<body>

<!-- TITLE BAR -->
<div class="titlebar">
  <div class="titlebar-left">
    <div class="app-icon">✦</div>
    <span class="app-name">TaskFlow</span>
  </div>
  <div class="titlebar-controls">
    <button class="ctrl-btn ctrl-close"></button>
    <button class="ctrl-btn ctrl-min"></button>
    <button class="ctrl-btn ctrl-max"></button>
  </div>
</div>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Menu</div>
      <div class="nav-item active" onclick="setView('all')">
        <span class="icon">◈</span> All Tasks
        <span class="nav-badge" id="badge-all">0</span>
      </div>
      <div class="nav-item" onclick="setView('today')">
        <span class="icon">◷</span> Today
      </div>
      <div class="nav-item" onclick="setView('done')">
        <span class="icon">✓</span> Completed
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Tags</div>
      <div class="nav-item" onclick="filterTag('work')"><span class="icon">💼</span> Work</div>
      <div class="nav-item" onclick="filterTag('personal')"><span class="icon">🌿</span> Personal</div>
      <div class="nav-item" onclick="filterTag('health')"><span class="icon">💚</span> Health</div>
      <div class="nav-item" onclick="filterTag('urgent')"><span class="icon">🔥</span> Urgent</div>
    </div>
    <div class="sidebar-avatar">
      <div class="avatar">U</div>
      <div class="avatar-info">
        <div class="avatar-name">You</div>
        <div class="avatar-role">Free Plan</div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="toolbar">
      <div class="toolbar-title" id="view-title">All Tasks</div>
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input type="text" placeholder="Search tasks..." id="search-input" oninput="renderTasks()"/>
      </div>
      <button class="btn-primary" onclick="openModal()">＋ Add Task</button>
    </div>

    <div class="content">
      <!-- STATS -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Total Tasks</div>
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-sub">all tasks</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Completed</div>
          <div class="stat-value" style="color:var(--green)" id="stat-done">0</div>
          <div class="stat-sub"><span class="stat-dot" style="background:var(--green)"></span>finished</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Pending</div>
          <div class="stat-value" style="color:var(--yellow)" id="stat-pending">0</div>
          <div class="stat-sub"><span class="stat-dot" style="background:var(--yellow)"></span>to-do</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Urgent</div>
          <div class="stat-value" style="color:var(--red)" id="stat-urgent">0</div>
          <div class="stat-sub"><span class="stat-dot" style="background:var(--red)"></span>high priority</div>
        </div>
      </div>

      <!-- TASK SECTION -->
      <div class="section-header">
        <div class="section-title">Tasks</div>
        <div class="filter-tabs">
          <button class="filter-tab active" onclick="setPriFilter('all',this)">All</button>
          <button class="filter-tab" onclick="setPriFilter('high',this)">High</button>
          <button class="filter-tab" onclick="setPriFilter('mid',this)">Medium</button>
          <button class="filter-tab" onclick="setPriFilter('low',this)">Low</button>
        </div>
      </div>

      <div class="task-list" id="task-list"></div>
    </div>
  </main>
</div>

<!-- ADD TASK MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title">New Task</div>
    <div class="form-group">
      <label class="form-label">TASK TITLE</label>
      <input class="form-input" id="inp-title" placeholder="What needs to be done?" type="text"/>
    </div>
    <div class="form-group form-row">
      <div>
        <label class="form-label">TAG</label>
        <select class="form-select" id="inp-tag">
          <option value="work">💼 Work</option>
          <option value="personal">🌿 Personal</option>
          <option value="health">💚 Health</option>
          <option value="urgent">🔥 Urgent</option>
        </select>
      </div>
      <div>
        <label class="form-label">PRIORITY</label>
        <select class="form-select" id="inp-priority">
          <option value="high">🔴 High</option>
          <option value="mid">🟡 Medium</option>
          <option value="low">🟢 Low</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">DUE DATE</label>
      <input class="form-input" id="inp-date" type="date"/>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="addTask()">Add Task</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <span class="toast-icon" id="toast-icon">✓</span>
  <span id="toast-msg">Task added!</span>
</div>

<script>
let tasks = [
  { id:1, title:"Review project proposal", tag:"work", priority:"high", date:"2026-03-24", done:false },
  { id:2, title:"Team standup meeting", tag:"work", priority:"mid", date:"2026-03-22", done:false },
  { id:3, title:"Morning workout", tag:"health", priority:"mid", date:"2026-03-22", done:true },
  { id:4, title:"Buy groceries", tag:"personal", priority:"low", date:"2026-03-23", done:false },
  { id:5, title:"Submit expense report", tag:"urgent", priority:"high", date:"2026-03-22", done:false },
  { id:6, title:"Read 30 pages", tag:"personal", priority:"low", date:"2026-03-25", done:true },
];
let nextId = 10;
let currentView = 'all';
let currentPriFilter = 'all';
let currentTagFilter = null;

function setView(v) {
  currentView = v; currentTagFilter = null;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  event.currentTarget.classList.add('active');
  const titles = {all:'All Tasks', today:"Today's Tasks", done:'Completed'};
  document.getElementById('view-title').textContent = titles[v] || v;
  renderTasks();
}
function filterTag(tag) {
  currentTagFilter = tag; currentView = 'all';
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.getElementById('view-title').textContent = tag.charAt(0).toUpperCase()+tag.slice(1);
  renderTasks();
}
function setPriFilter(p, el) {
  currentPriFilter = p;
  document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

function renderTasks() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const today = new Date().toISOString().split('T')[0];
  let filtered = tasks.filter(t => {
    if (search && !t.title.toLowerCase().includes(search)) return false;
    if (currentTagFilter && t.tag !== currentTagFilter) return false;
    if (currentView === 'today' && t.date !== today) return false;
    if (currentView === 'done' && !t.done) return false;
    if (currentView === 'all' && currentView !== 'done') {}
    if (currentPriFilter !== 'all' && t.priority !== currentPriFilter) return false;
    return true;
  });

  const list = document.getElementById('task-list');
  if (!filtered.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">No tasks here yet</div></div>`;
  } else {
    list.innerHTML = filtered.map(t => `
      <div class="task-item ${t.done?'done':''}" onclick="toggleDone(${t.id})">
        <div class="checkbox">${t.done?'✓':''}</div>
        <div class="task-info">
          <div class="task-title">${t.title}</div>
          <div class="task-meta">
            <span class="task-tag tag-${t.tag}">${t.tag}</span>
            <span>${t.date}</span>
          </div>
        </div>
        <div class="priority-dot p-${t.priority}"></div>
        <div class="task-actions" onclick="event.stopPropagation()">
          <button class="task-action-btn" onclick="deleteTask(${t.id})" title="Delete">✕</button>
        </div>
      </div>
    `).join('');
  }

  // Stats
  document.getElementById('stat-total').textContent = tasks.length;
  document.getElementById('stat-done').textContent = tasks.filter(t=>t.done).length;
  document.getElementById('stat-pending').textContent = tasks.filter(t=>!t.done).length;
  document.getElementById('stat-urgent').textContent = tasks.filter(t=>t.priority==='high'&&!t.done).length;
  document.getElementById('badge-all').textContent = tasks.filter(t=>!t.done).length;
}

function toggleDone(id) {
  const t = tasks.find(t=>t.id===id);
  if(t) { t.done = !t.done; showToast(t.done?'Task completed! 🎉':'Task reopened','✦'); renderTasks(); }
}
function deleteTask(id) {
  tasks = tasks.filter(t=>t.id!==id);
  showToast('Task deleted','✕');
  renderTasks();
}

function openModal() {
  document.getElementById('modal').classList.add('open');
  document.getElementById('inp-title').focus();
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('inp-date').value = today;
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

function addTask() {
  const title = document.getElementById('inp-title').value.trim();
  if(!title) { document.getElementById('inp-title').style.borderColor='var(--red)'; return; }
  tasks.unshift({
    id: nextId++,
    title,
    tag: document.getElementById('inp-tag').value,
    priority: document.getElementById('inp-priority').value,
    date: document.getElementById('inp-date').value || new Date().toISOString().split('T')[0],
    done: false
  });
  document.getElementById('inp-title').value='';
  document.getElementById('inp-title').style.borderColor='';
  closeModal(); renderTasks();
  showToast('Task added successfully ✦','✦');
}

let toastTimer;
function showToast(msg, icon='✓') {
  clearTimeout(toastTimer);
  document.getElementById('toast-msg').textContent = msg;
  document.getElementById('toast-icon').textContent = icon;
  const t = document.getElementById('toast');
  t.classList.add('show');
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2500);
}

document.getElementById('modal').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); if(e.key==='Enter'&&document.getElementById('modal').classList.contains('open')) addTask(); });

renderTasks();
</script>
</body>
</html>
